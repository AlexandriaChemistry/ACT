# Recipe for the conda packages alexandria (programs, libraries and data) and
# alexandria-python (the Python package act), built with rattler-build, see
# README.md in this directory and docs/conda-packaging-plan.md. They need the
# package act-utilities of the repository ACT-utilities.
#
# The source is the directory or archive in the environment variable
# ACT_SOURCE, by default the ACT tree that contains this recipe. The
# script build-local.sh builds from an archive of the last commit, such that
# untracked files, for instance build directories, are not copied. The recipe
# of the conda-forge feedstock takes the archive of a release tag instead.

context:
  version: "1.95"

recipe:
  name: alexandria-split
  version: ${{ version }}

source:
  path: ${{ env.get("ACT_SOURCE", default="../..") }}

# The number goes up with each upload of the same version: the upload skips
# files that are on the channel already, and alexandria-python requires the
# alexandria of its own build, by its name.
build:
  number: 0
  skip:
    - not ((osx and arm64) or (linux and (x86_64 or aarch64)))

outputs:
  - package:
      name: alexandria
    build:
      string: mpi_${{ mpi }}_${{ gpu }}_h${{ hash }}_${{ build_number }}
      script:
        file: build.sh
        env:
          ACT_GPU_VARIANT: ${{ gpu }}
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake >=3.24
        - make
        - if: build_platform != target_platform
          then:
            - ${{ mpi }}
        # Compiles everything for x86-64-v3 (AVX2, FMA); its run_exports keep
        # the package from installing on processors without AVX2
        - if: linux and x86_64
          then:
            - x86_64-microarch-level ==3
      host:
        - ${{ mpi }}
        # CMake checks that the Python modules of ACT-utilities can be imported
        - python
        - act-utilities ==${{ version }}
        - libxml2-devel
        - eigen >=5
        - nlohmann_json
        - libboost-devel
        - librdkit-dev
        - librdkit
        - libsqlite
        # Not older than the AdaptiveCpp that the packages are tested with:
        # without the lower bound the solver takes an old build if a newer
        # one cannot be combined with the newest builds of the packages
        # above, as during a migration of conda-forge, and old builds do not
        # depend on the clang that acpp calls, such that nothing compiles
        - if: gpu == "sycl_cuda"
          then:
            - adaptivecpp >=25.10 cuda*
      run:
        - ${{ mpi }}
        - act-utilities ==${{ version }}
        # The libraries of RDKit change ABI with each release
        - ${{ pin_compatible('librdkit', upper_bound='x.x.x') }}
        # A build of AdaptiveCpp with the CUDA backend, for any CUDA version:
        # the solver takes the newest that the NVIDIA driver supports, for
        # instance cuda129 with driver 550, since cuda130 needs driver 580
        - if: gpu == "sycl_cuda"
          then:
            - ${{ pin_compatible('adaptivecpp', upper_bound='x.x', build='cuda*') }}
      # The run_exports of librdkit pin one build string of it, python only
      # serves the check of CMake for ACT-utilities and would pin the Python
      # version of the environment
      ignore_run_exports:
        by_name:
          - librdkit
          - python
          - python_abi
      run_constraints:
        - if: gpu == "sycl_cuda"
          then:
            - __cuda
    tests:
      - script:
          # MPICH may fail to open the network devices of the test machine,
          # see build.sh
          - export UCX_TLS=self,sm,tcp
          - alexandria -h
          - alexandria train_ff -h
          - test -f $PREFIX/share/act/alexandria.json
          - 'alexandria -version | grep "Precision: *single"'
          - if: (osx and arm64) or (linux and aarch64)
            then: 'alexandria -version | grep "Explicit SIMD: *ARM_NEON"'
          - if: linux and x86_64
            then: 'alexandria -version | grep "Explicit SIMD: *AVX2"'
          - if: gpu == "sycl_cuda"
            then: 'alexandria -version | grep "GPU support: *SYCL"'

  # The Python package act: the alexandria program from Python, and the
  # classes of ACT in the module act._core. The module has the code of ACT
  # in it (static libraries, without GPU support), such that it depends on
  # the Python version only, and is built once for each. It runs the program
  # and reads the data files of the package alexandria it was built with.
  - package:
      name: alexandria-python
    build:
      string: py${{ act_python | replace(".", "") }}_mpi_${{ mpi }}_h${{ hash }}_${{ build_number }}
      script:
        file: build-python.sh
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake >=3.24
        - make
        - if: build_platform != target_platform
          then:
            - ${{ mpi }}
        - if: linux and x86_64
          then:
            - x86_64-microarch-level ==3
      host:
        - ${{ mpi }}
        - python ${{ act_python }}.*
        - pybind11 >=2.10
        # The classes give numbers as numpy arrays, also in the tests of build-python.sh
        - numpy
        # The program for the tests in build-python.sh
        - ${{ pin_subpackage('alexandria', exact=True) }}
        - act-utilities ==${{ version }}
        - libxml2-devel
        - eigen >=5
        - nlohmann_json
        - libboost-devel
        - librdkit-dev
        - librdkit
        - libsqlite
      run:
        - python
        - numpy
        - ${{ mpi }}
        - ${{ pin_subpackage('alexandria', exact=True) }}
        - ${{ pin_compatible('librdkit', upper_bound='x.x.x') }}
      ignore_run_exports:
        by_name:
          - librdkit
    tests:
      - python:
          imports:
            - act
            - act._core
          pip_check: false
      - script:
          # See the tests of alexandria
          - export UCX_TLS=self,sm,tcp
          - python check-python-package.py
        files:
          recipe:
            - check-python-package.py
          source:
            - src/act/testdata/forcefields/ACS-g1.xml
            - src/act/testdata/molecules/acetone.sdf

about:
  homepage: https://github.com/AlexandriaChemistry/ACT
  repository: https://github.com/AlexandriaChemistry/ACT
  documentation: https://alexandriachemistry.github.io/ACT
  license: GPL-2.0-or-later AND LGPL-2.1-or-later
  license_file: COPYING
  summary: Alexandria Chemistry Toolkit, machine learning of physics-based force fields
  description: |
    The Alexandria Chemistry Toolkit (ACT) trains physics-based force fields
    for molecular simulation on quantum chemistry data, with evolutionary
    algorithms and Markov chain Monte Carlo. The ACT files are under the GPL
    version 2 or later, the parts derived from GROMACS under the LGPL version
    2.1 or later.

extra:
  recipe-maintainers:
    - dspoel
    - JulianKoengeter
    - MansRosenbaum
