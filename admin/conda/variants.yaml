# Variants of the conda packages, see docs/conda-packaging-plan.md
mpi:
  - mpich
  - openmpi

# The Python versions of the package alexandria-python. Not the key python
# of conda-forge: the package alexandria, which has a Python in its build
# only for a check of CMake, would be built for each version as well.
act_python:
  - "3.11"
  - "3.12"
  - "3.13"
  - "3.14"

gpu:
  - if: osx
    then: [none]
  - if: linux
    then: [sycl_cuda]   # also runs without a GPU, on the processor

c_compiler:
  - if: osx
    then: [clang]
  - if: linux
    then: [gcc]
cxx_compiler:
  - if: osx
    then: [clangxx]
  - if: linux
    then: [gxx]
c_compiler_version:
  - if: osx
    then: ["19"]
  - if: linux
    then: ["14"]
cxx_compiler_version:
  - if: osx
    then: ["19"]
  - if: linux
    then: ["14"]

c_stdlib:
  - if: osx
    then: [macosx_deployment_target]
  - if: linux
    then: [sysroot]
c_stdlib_version:
  - if: osx
    then: ["11.0"]
  - if: linux
    then: ["2.28"]
