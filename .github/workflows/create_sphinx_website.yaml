name: Create Sphinx website

on:
  push:
    branches:
      - main
      - website
  pull_request:
    branches:
      - main
      - website

jobs:
  create_website:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write       # Added for GitHub Pages deployment
      id-token: write    # Necessary for actions/deploy-pages
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6

      # Build Doxygen documentation
      # Copied from the act-test.yaml file
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt-get update
          sudo apt-get -y install gcc cmake libopenmpi-dev openmpi-bin  texlive-latex-recommended texlive-latex-extra libxml2-dev latexmk texlive-fonts-recommended
      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          channels: conda-forge
          conda-remove-defaults: "true"
          auto-activate: true
          python-version: ${{ matrix.python-version }}
      - name: Conda info
        shell: bash -el {0}
        run: |
          conda info
          conda config --add channels conda-forge
          conda install librdkit-dev=2025.09.4 libboost-devel eigen=5.0.1 doxygen graphviz pygments nlohmann_json pybind11
          # The location of the environment differs between runner images
          echo "ACT_CONDA_PREFIX=${CONDA_PREFIX}" >> ${GITHUB_ENV}
      - name: Install dependencies
        # Into the Python of conda, for which the module with the classes
        # of ACT is built, which the reference of the Python package in
        # the manual imports
        shell: bash -el {0}
        run: python -m pip install -r requirements.txt

      - name: Check out ACT-utilities
        uses: actions/checkout@v6
        with:
          repository: AlexandriaChemistry/ACT-utilities
          path: ACT-utilities
      - name: Install ACT-utilities
        run: |
          # The Python modules, scripts and data files that ACT requires
          # With the same CMAKE_PREFIX_PATH as ACT, such that both use the same Python
          cmake -S ACT-utilities -B ACT-utilities/build -DBUILD_TESTING=OFF -DCMAKE_PREFIX_PATH=${ACT_CONDA_PREFIX} -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/../tools
          cmake --install ACT-utilities/build
      - name: Install ACT
        shell: bash -el {0}
        run: |
          cd ${{ github.workspace }}
          mkdir build; cd build
          export MPICXX=/usr/bin/g++
          export MPICC=/usr/bin/gcc
          export CXXFLAGS='-std=c++20'
          cmake -DACT_DOUBLE=ON -DCMAKE_PREFIX_PATH=${ACT_CONDA_PREFIX} -DBUILD_SHARED_LIBS=OFF -DACT_OPENMP=OFF -DACT_MPI=ON -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/../tools -DCMAKE_BUILD_TYPE=Release -DACT_BUILD_MANUAL=ON -DACT_PYTHON=ON -DCMAKE_CXX_COMPILER=${MPICXX} -DCMAKE_C_COMPILER=${MPICC} ..
          make -j 4 doxygen-full website manual
          mkdir ../_build
          mv docs/html/doxygen/html-full ../_build/doxygen
          mv docs/manual/html/* ../_build/
          mv docs/manual/latex/act.pdf ../_build/
      - name: Upload notebook error log
        if: failure() # Only runs if the job fails
        uses: actions/upload-artifact@v7
        with:
          name: EEM-without-shells-error-log
          path: build/docs/manual/html/reports/jupyter/EEM-without-shells.err.log

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/website') }}
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _build/
          force_orphan: true

      - name: Install linter
        run: pip install sphinx-lint

      - name: Run linter, will never give an error
        run: sphinx-lint docs || true

